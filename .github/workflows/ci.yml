name: Web CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Type check, lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://cloudlink-agents.onrender.com"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  e2e:
    name: Dashboard e2e (Playwright, mocked backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Production build with Clerk replaced by e2e/clerk-stub and the API
      # pointed at a host the tests intercept. Needs no secrets.
      - name: Build (e2e)
        run: npm run build:e2e

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify-deploy:
    name: Notify Cloudlink of deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Send deploy event
        run: |
          curl -sf -X POST "${{ secrets.CLOUDLINK_API_URL }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.CLOUDLINK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "service": "cloudlinkglobal-web",
              "version": "${{ github.sha }}",
              "environment": "production",
              "commit_message": ${{ toJSON(github.event.head_commit.message) }}
            }' || echo "Deploy notification failed (non-fatal)"
